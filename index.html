<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Activos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; }
        .card-bg { background-color: #1e293b; }
        .text-cyan { color: #38bdf8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Aquí va el resto de tu contenido HTML original -->
    </div>

    <script>
        function registrarOperacion(tipo, activo) {
            const tbody = document.getElementById('historial-body');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td class="p-2">07/07/2026</td>
                <td class="p-2">${tipo}</td>
                <td class="p-2">${activo}</td>
                <td class="p-2 text-green-500">Completada</td>
            `;
            tbody.appendChild(fila);
        }

        const pools = [
            { nombre: "YAYICOIN", address: "0xda..." },
            { nombre: "YAYIBTC", address: "0x9b..." }
        ];

        function cargarPools() {
            pools.forEach(pool => {
                const idElemento = "price-" + pool.nombre.toLowerCase();
                const elemento = document.getElementById(idElemento);
                if (elemento) {
                    elemento.innerText = "$1,00";
                }
            });
        }

        window.onload = cargarPools;

        function comprarCrypto() {
            window.open("https://global.transak.com");
        }
    </script>
</body>
</html>

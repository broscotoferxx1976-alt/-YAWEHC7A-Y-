<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL PRO</title>
    <!-- Cargamos Web3Modal para los logos universales -->
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        button { padding: 15px; margin: 5px; background: #00ff00; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="section">
        <button id="btn-connect">Conectar Billetera</button>
        <p id="wallet-address">Estado: Desconectado</p>
    </div>

    <script>
        const Web3Modal = window.Web3Modal.default;
        const web3Modal = new Web3Modal({
            cacheProvider: false,
            providerOptions: {
                walletconnect: {
                    package: window.WalletConnectProvider.default,
                    options: { infuraId: "84842078b09946638c03157f83405213" }
                }
            }
        });

        document.getElementById('btn-connect').onclick = async () => {
            try {
                const instance = await web3Modal.connect();
                const provider = new ethers.providers.Web3Provider(instance);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById('wallet-address').innerText = "Conectado: " + address;
            } catch (e) {
                console.log("Conexión cancelada", e);
            }
        };
    </script>
</body>
</html>

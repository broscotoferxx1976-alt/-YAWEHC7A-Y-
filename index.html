<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC | Ecosistema DeFi</title>
    <style>
        body { background: #0a0a0c; color: #d1d4dc; font-family: 'Courier New', monospace; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .card { background: #131722; border: 1px solid #2a2e39; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { color: #f3ba2f; font-size: 1rem; margin-bottom: 15px; border-bottom: 1px solid #2a2e39; padding-bottom: 5px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; }
        .btn-connect { background: #f3ba2f; color: #000; }
        .btn-swap { background: #00ff88; color: #000; }
        .info-text { font-size: 0.85rem; line-height: 1.5; color: #787b86; }
        .token-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. CONEXIÓN DE BILLETERA -->
    <div class="card">
        <h2>CONEXIÓN DE BILLETERA</h2>
        <button class="btn btn-connect" onclick="alert('Conectando a BSC Network...')">CONECTAR METAMASK / TRUST WALLET</button>
    </div>

    <!-- 2. PORTAL DE INTERCAMBIO (SWAP) -->
    <div class="card">
        <h2>PORTAL DE INTERCAMBIO (SWAP)</h2>
        <a href="https://pancakeswap.finance/" target="_blank" class="btn btn-swap">IR A PANCAKESWAP (COMPRA AQUÍ)</a>
    </div>

    <!-- 3. TOKENOMICS E INFORMACIÓN -->
    <div class="card">
        <h2>TOKENOMICS E INFORMACIÓN</h2>
        <div class="info-text">
            <p>Ecosistema descentralizado operando en BSC Network.</p>
            <div class="token-row"><span>YAWEHC1</span><span>DESPLEGADO</span></div>
            <div class="token-row"><span>YAWEHC4</span><span>DESPLEGADO</span></div>
            <p style="margin-top:10px;">Seguridad: Auditoría interna de contratos maestros.</p>
        </div>
    </div>
</div>

</body>
</html>

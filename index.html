<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v3.8</title>
    <style>
        body { background-color: #050505; color: #3b82f6; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 650px; margin: auto; }
        .card { background-color: #080a0f; border: 1px solid #3b82f6; padding: 20px; border-radius: 5px; margin-bottom: 15px; }
        .trade-btn { background: #3b82f6; color: #fff; border: none; padding: 10px; width: 48%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2>AUTORIDAD SUPREMA</h2>
            <p style="font-size: 11px;">PASTOR Y PROFETA: <b>ANDRÉS MARTÍNEZ ARACIL</b> | PROFETA: <b>YOANKA RAMÍREZ GARRIDO</b></p>
        </div>

        <div class="card">
            <h2>TERMINAL DE ANÁLISIS GLOBAL</h2>
            <!-- Widget avanzado con buscador de activos -->
            <div class="tradingview-widget-container" style="height:350px;">
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js">
                {
                    "autosize": true,
                    "symbol": "BTCUSD",
                    "interval": "D",
                    "timezone": "Europe/Madrid",
                    "theme": "dark",
                    "style": "1",
                    "locale": "es",
                    "allow_symbol_change": true,
                    "calendar": false
                }
                </script>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="trade-btn" onclick="window.location.href='https://pancakeswap.finance'">COMPRAR</button>
                <button class="trade-btn" onclick="window.location.href='https://pancakeswap.finance'">VENDER</button>
            </div>
        </div>

        <div class="card">
            <h2>PROYECTO: IGLESIA DE MANDARACHE</h2>
            <div style="font-size: 11px;">
                • Capacidad: 7,000 butacas | Estructura: 70 columnas | Doble sótano (Parking + Custodia Oro)
            </div>
        </div>

        <div class="card">
            <h2>CUSTODIA DE ACTIVOS</h2>
            <input type="password" id="key" style="background:#000; color:#fff; border:1px solid #3b82f6; width:100%; padding:8px;">
            <button onclick="acceder()" style="background:#050505; color:#3b82f6; border:1px solid #3b82f6; width:100%; padding:10px; margin-top:10px; cursor:pointer;">DESBLOQUEAR BÓVEDA</button>
            <div id="output" style="margin-top:15px; font-size: 12px;"></div>
        </div>
    </div>

    <script>
        function acceder() {
            const k = document.getElementById('key').value;
            const out = document.getElementById('output');
            if(k.toUpperCase() === "ESPIRITU SANTO") {
                out.innerHTML = "BÓVEDA ABIERTA:<br>ORO: 1 Billón de Toneladas<br>USD: 700";
            } else {
                out.innerText = "ACCESO RESTRINGIDO";
            }
        }
    </script>
</body>
</html>

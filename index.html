<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v1.0</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .section { background: #2d2d2d; padding: 20px; margin: 20px 0; border-radius: 10px; }
        select, button { padding: 15px; width: 80%; margin: 10px; border-radius: 5px; font-size: 16px; }
        button { background: #00ff00; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YAWEHC TERMINAL v1.0</h1>
        <div class="section">
            <h2>1. Conexión de Billetera</h2>
            <button id="connectWallet">Conectar Billetera</button>
            <p id="walletAddress" style="color: #00ff00;"></p>
        </div>
        <div class="section">
            <h2>2. Swap (Intercambio)</h2>
            <select id="tokenSelector">
                <option value="0x1601dc6ff5dbf0b441bd2ff054433730485a8e25">YAWEHC1</option>
                <option value="0x0a7dd4079b106de376e08d1dc6686b7d0b53c40c">YAWEHC2</option>
            </select>
            <button id="swapBtn">Intercambiar Activo Seleccionado</button>
        </div>
    </div>

    <script>
        const connectWalletBtn = document.getElementById('connectWallet');
        const walletAddressDisplay = document.getElementById('walletAddress');
        const tokenSelector = document.getElementById('tokenSelector');
        const swapBtn = document.getElementById('swapBtn');

        connectWalletBtn.addEventListener('click', async () => {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            walletAddressDisplay.innerText = "Conectado: " + accounts[0].substring(0, 6) + "...";
            connectWalletBtn.innerText = "Billetera Conectada";
        });

        swapBtn.addEventListener('click', () => {
            const selectedContract = tokenSelector.value;
            alert('Iniciando transacción para el contrato: ' + selectedContract);
        });
    </script>
</body>
</html>

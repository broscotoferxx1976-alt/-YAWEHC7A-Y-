<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC.com | Mercado en Vivo</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        .dashboard { max-width: 600px; margin: auto; background: #0a0a0a; border: 1px solid #ffd700; padding: 20px; border-radius: 15px; }
        .activo-card { background: #1a1a1a; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #ffd700; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>YAWEHC.com | MERCADO</h1>
        <div id="lista-precios">
            <div class="activo-card"><span>YAWEHC1</span><span id="p-c1">Cargando...</span></div>
            <div class="activo-card"><span>YAWEHC2</span><span id="p-c2">Cargando...</span></div>
            <div class="activo-card"><span>YAWEHC3</span><span id="p-c3">Cargando...</span></div>
            <div class="activo-card"><span>YAWEHC3B</span><span id="p-c3b">Cargando...</span></div>
            <div class="activo-card"><span>A&YCOIN TOKEN</span><span id="p-ay">Cargando...</span></div>
        </div>
    </div>

    <script>
        const API_KEY = "CG-Dtc8YGJLtZa53Mqg8iiFHd6f";
        const tokens = {
            "p-c1": "0x1601DC6Ff5dBf0b441bD2fF054433730485a8e25",
            "p-c2": "0x8979313437a342416f404285750d99532832D376",
            "p-c3": "0x4016664971d5b3dE2499dC21908a8E9c74895690",
            "p-c3b": "0x116e0018e69818817a783777f9859f518eE4268e",
            "p-ay": "0x838c64c78d063717d2d31284d7d3d8a7d1880486"
        };

        async function obtenerPrecios() {
            const direcciones = Object.values(tokens).join(',');
            const url = `https://api.coingecko.com/api/v3/simple/token_price/binance-smart-chain?contract_addresses=${direcciones}&vs_currencies=usd&x_cg_demo_api_key=${API_KEY}`;
            
            try {
                const respuesta = await fetch(url);
                const datos = await respuesta.json();

                for (const [id, contrato] of Object.entries(tokens)) {
                    const precio = datos[contrato.toLowerCase()]?.usd;
                    document.getElementById(id).innerText = precio ? `$${precio}` : "N/A";
                }
            } catch (error) {
                console.error("Error al conectar:", error);
            }
        }
        obtenerPrecios();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        select, input, button { padding: 15px; margin: 5px; width: 90%; display: block; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; border: none; color: black; }
        input { color: black; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    
    <div class="section">
        <button id="btn-connect" onclick="connectWallet()">Conectar Billetera</button>
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3">YAWEHC3</option>
        </select>
        <input type="text" id="contractAddress" placeholder="Dirección contrato">
        <button onclick="ejecutarAccion()">SWAP</button>
    </div>

    <div class="section" id="chart-container" style="height: 200px;">
        <!-- Espacio para el visor -->
    </div>

    <script>
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    alert("Conectado: " + accounts[0]);
                } catch (err) {
                    alert("Error al conectar: " + err.message);
                }
            } else {
                alert("MetaMask no detectado. Por favor, abre esta web dentro del navegador de tu billetera.");
            }
        }

        function ejecutarAccion() {
            const addr = document.getElementById('contractAddress').value;
            alert("Operación preparada para: " + addr);
        }
    </script>
</body>
</html>

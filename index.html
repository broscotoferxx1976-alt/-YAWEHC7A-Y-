<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 15px; }
        .section { background: #2d2d2d; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        select, input, button { padding: 12px; margin: 5px; width: 90%; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; border: none; }
        #chart-container { width: 100%; height: 250px; background-color: #000; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    
    <div class="section">
        <button id="btn-connect" onclick="connectWallet()">Conectar Billetera</button>
        <p id="wallet-address">Estado: Desconectado</p>
        
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3">YAWEHC3</option>
            <option value="AYCOIN">A&YCOIN TOKEN</option>
        </select>
        <input type="text" id="contractAddress" placeholder="Dirección contrato">
        <button onclick="ejecutarSwap()">SWAP</button>
    </div>

    <div class="section">
        <div id="chart-container"></div>
    </div>

    <script>
        // Lógica Conexión
        async function connectWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('wallet-address').innerText = "Conectado: " + accounts[0].substring(0,10) + "...";
            } else { alert("Abre esta web desde el navegador de tu app MetaMask."); }
        }

        // Lógica SWAP
        function ejecutarSwap() {
            const addr = document.getElementById('contractAddress').value;
            alert("Iniciando SWAP con el contrato: " + addr);
        }

        // Gráfico (Visor)
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            width: document.getElementById('chart-container').clientWidth,
            height: 250,
            layout: { backgroundColor: '#000', textColor: '#FFF' }
        });
        chart.addCandlestickSeries().setData([{ time: '2026-06-25', open: 1.0, high: 1.5, low: 0.8, close: 1.2 }]);
    </script>
</body>
</html>

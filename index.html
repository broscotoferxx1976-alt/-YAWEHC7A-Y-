<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        button { padding: 15px; margin: 5px; background: #00ff00; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="section">
        <button id="btn-connect" onclick="connectWallet()">Conectar Billetera</button>
        <p id="wallet-address">Estado: Desconectado</p>
    </div>

    <script>
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('wallet-address').innerText = "Conectado: " + accounts[0];
                } catch (error) {
                    alert("Error al conectar: " + error.message);
                }
            } else {
                alert("MetaMask no detectado. Abre esta web desde el navegador de tu app MetaMask.");
            }
        }
    </script>
</body>
</html>

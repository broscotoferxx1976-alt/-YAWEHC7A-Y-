<!DOCTYPE html>
<html lang="es">
<<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.1/lightweight-charts.standalone.production.min.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL v2.0</title>
    <script src="[https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js](https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js)"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; margin: 20px auto; border-radius: 10px; max-width: 500px; }
        input, select, button { padding: 15px; width: 90%; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; color: black; }
        #chart-container { width: 100%; height: 250px; margin-top: 10px; background: #000; border-radius: 5px; overflow: hidden; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="section">
        <div id="chart-container"></div>
    </div>
    
    <script>
    try {
        const container = document.getElementById('chart-container');
        if (!container) throw new Error("No encuentro el chart-container");
        
        container.style.width = '100%';
        container.style.height = '250px';

        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: 250,
            layout: { backgroundColor: '#000000', textColor: '#FFFFFF' }
        });

        const candleSeries = chart.addCandlestickSeries();
        candleSeries.setData([
            { time: '2026-06-23', open: 1.0, high: 1.2, low: 0.9, close: 1.1 },
            { time: '2026-06-24', open: 1.1, high: 1.3, low: 1.0, close: 1.2 },
            { time: '2026-06-25', open: 1.2, high: 1.4, low: 1.1, close: 1.35 }
        ]);
        console.log("Gráfico creado");
    } catch (e) {
        document.body.innerHTML += '<p style="color:red">Error detectado: ' + e.message + '</p>';
    }
    </script>
    
</body>

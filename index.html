<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #1a1a1a; color: white; }
        .section { background: #2d2d2d; padding: 10px; margin: 10px; }
        select, input, button { padding: 10px; }
        button { background: #00ff00; font-weight: bold; }
        input { color: black; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>

    <div class="section">
        <button id="btn-connect" onclick="connectWallet()">Conectar Billetera</button>
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3(B)">YAWEHC3(B)</option>
            <option value="YAWEHC4">YAWEHC4</option>
            <option value="A&YCOIN TOKEN">A&YCOIN TOKEN</option>
        </select>
        <input type="text" id="contractAddress" placeholder="Dirección contrato">
        <button onclick="ejecutarAccion()">SWAP</button>
    </div>

    <div class="section" id="chart-container" style="height: 200px;">
        <!-- Espacio para el visor -->
    </div>

    <script>
        function ejecutarAccion() {
            const addr = document.getElementById('contractAddress').value;
            
            if (!addr) {
                alert("Por favor, ingresa la dirección del contrato primero.");
                return;
            }
            
            console.log("Iniciando SWAP para el contrato: " + addr);
            alert("Ejecutando SWAP en: " + addr);
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    alert("Conectado: " + accounts[0]);
                } catch (error) {
                    console.error("Error al conectar:", error);
                }
            } else {
                alert("Por favor, instala MetaMask o una billetera compatible.");
            }
        }
    </script>
</body>
</html>

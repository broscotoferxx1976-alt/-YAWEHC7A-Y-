<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL PROFESIONAL v2.2</title>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .dashboard { max-width: 600px; margin: auto; }
        .card { background-color: #111; border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 20px; }
        .status-light { height: 10px; width: 10px; background-color: #34d399; border-radius: 50%; display: inline-block; }
        .asset { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .footer-note { font-size: 10px; color: #666; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>YAWEHC TERMINAL <span style="color:#3b82f6;">v2.2</span></h1>
            <span><div class="status-light"></div> LIVE</span>
        </div>
        
        <div class="card">
            <h2>MERCADO GLOBAL</h2>
            <div id="mercado">Cargando precios...</div>
        </div>

        <div class="card">
            <h2>PATRIMONIO PRINCIPAL</h2>
            <div class="asset"><span>YAYIBTC</span> <span>VERIFICADO</span></div>
            <div class="asset"><span>YAYICOIN</span> <span>ACTIVO</span></div>
            
            <div class="btn-group">
                <button onclick="window.location.href='https://transak.com'">COMPRAR</button>
                <button onclick="window.location.href='https://pancakeswap.finance'">SWAP</button>
            </div>
        </div>

        <div class="card">
            <h2>CENTRO DE CONTROL</h2>
            <p style="font-size: 12px;">Estado del servidor: <b>ONLINE</b></p>
            <p style="font-size: 12px;">Nodo Blockchain: <b>SINCRONIZADO</b></p>
        </div>
        
        <div class="footer-note">SISTEMA CUSTODIADO POR ANDRÉS MARTÍNEZ ARACIL</div>
    </div>

    <script>
        async function fetchMarket() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('mercado').innerHTML = 
                    `<p>Bitcoin (BTC): <b>$${data.bitcoin.usd.toLocaleString()}</b></p>` +
                    `<p>Ethereum (ETH): <b>$${data.ethereum.usd.toLocaleString()}</b></p>`;
            } catch(e) { document.getElementById('mercado').innerText = "Error de conexión"; }
        }
        fetchMarket();
        setInterval(fetchMarket, 60000); // Se actualiza solo cada minuto
    </script>
</body>
</html>

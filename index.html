<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: Arial, sans-serif; }
        header { border-bottom: 2px solid #0f0; padding: 20px; text-align: center; }
        .controls { padding: 20px; text-align: center; }
        /* Contenedor del Widget */
        #pancake-swap-widget { display: flex; justify-content: center; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>YAWEHC TERMINAL v2.0</h1>
        <p>CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS</p>
    </header>

    <div class="controls">
        <div id="pancake-swap-widget"></div>
    </div>

    <script src="https://unpkg.com/@pancakeswap/widgets@latest/dist/widgets.bundle.js"></script>
    <script>
        window.addEventListener('load', function() {
            pancakeSwapWidget.init({
                container: '#pancake-swap-widget',
                chainId: 56,
                // Esto cargará el widget con la capacidad de conectar billetera y hacer swap
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Activos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; color: white; }
        .card-bg { background-color: #1e293b; }
        .text-cyan { color: #38bdf8; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <input type="text" placeholder="Search" class="bg-[#1e293b] p-2 rounded border border-gray-700 w-64">
            <select class="bg-[#1e293b] p-2 rounded border border-gray-700">
                <option>Todas las Cadenas</option>
            </select>
        </div>

        <div class="flex gap-4 mb-8">
            <button class="bg-[#1e293b] px-4 py-2 rounded border border-gray-700">Gráfico Avanzado</button>
            <button class="bg-[#1e293b] px-4 py-2 rounded border border-gray-700">Alertas</button>
            <button class="bg-[#1e293b] px-4 py-2 rounded border border-gray-700">Mis Favoritos</button>
            <button class="bg-[#1e293b] px-4 py-2 rounded border border-gray-700">Gestión de Portafolio</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="card-bg p-4 rounded-lg border border-gray-700">
                <h3 class="text-green-400 mb-2">Top Ganadores</h3>
                <div id="top-ganadores"></div>
            </div>
            <div class="card-bg p-4 rounded-lg border border-gray-700">
                <h3 class="text-red-400 mb-2">Top Perdedores</h3>
                <div id="top-perdedores"></div>
            </div>
        </div>

        <h2 class="text-cyan text-xl mb-4">Terminal de Activos</h2>
        <div class="card-bg rounded-lg border border-gray-700 overflow-hidden">
            <table class="w-full text-left">
                <thead class="border-b border-gray-700 text-gray-400 text-sm">
                    <tr>
                        <th class="p-4">Activo</th>
                        <th class="p-4">Precio (USD)</th>
                        <th class="p-4">Capitalización</th>
                        <th class="p-4">Volumen 24h</th>
                        <th class="p-4">Cambio 24h</th>
                    </tr>
                </thead>
                <tbody id="tabla-activos" class="text-sm">
                    </tbody>
            </table>
        </div>
    </div>

</body>
</html>

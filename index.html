<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v3.0</title>
    <style>
        body { background-color: #050505; color: #3b82f6; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 650px; margin: auto; }
        .card { background-color: #080a0f; border: 1px solid #3b82f6; padding: 20px; border-radius: 5px; margin-bottom: 15px; }
        .grid-status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; }
        .stat-box { border: 1px solid #1e293b; padding: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2>MANDO CENTRAL</h2>
            <p style="font-size: 11px;">PASTOR Y PROFETA: ANDRÉS MARTÍNEZ ARACIL<br>PROFETA: YOANKA RAMÍREZ GARRIDO</p>
        </div>

        <div class="card">
            <h2>GESTIÓN ESTRUCTURAL: IGLESIA MANDARACHE</h2>
            <div class="grid-status">
                <div class="stat-box">BUTACAS<br><b style="color:#fff;">7,000</b></div>
                <div class="stat-box">COLUMNAS<br><b style="color:#fff;">70</b></div>
            </div>
            <p style="font-size: 10px; margin-top: 10px;">ESTADO: PROYECTO CUSTODIADO Y EN VIGILANCIA ACTIVA.</p>
        </div>

        <div class="card">
            <h2>CUSTODIA DE ACTIVOS</h2>
            <input type="password" id="key" style="background:#000; color:#fff; border:1px solid #3b82f6; width:100%; padding:8px;">
            <button onclick="acceder()" style="background:#050505; color:#3b82f6; border:1px solid #3b82f6; width:100%; padding:10px; margin-top:10px; cursor:pointer;">DESBLOQUEAR BÓVEDA</button>
            <div id="output" style="margin-top:15px; font-size: 12px;"></div>
        </div>
    </div>

    <script>
        function acceder() {
            const k = document.getElementById('key').value;
            const out = document.getElementById('output');
            if(k.toUpperCase() === "ESPIRITU SANTO") {
                out.innerHTML = "BÓVEDA ABIERTA:<br>ORO: 1 Billón de Toneladas<br>USD: 700";
            } else {
                out.innerText = "ACCESO RESTRINGIDO";
            }
        }
    </script>
</body>
</html>

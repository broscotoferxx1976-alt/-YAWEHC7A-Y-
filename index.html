<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal de Custodia - ESPIRITU SANTO</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .custodia { border: 2px solid #eab308; text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        h1 { color: #38bdf8; }
        .valor { font-size: 1.5em; font-weight: bold; color: #eab308; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sección de Custodia -->
        <div class="card custodia">
            <h2>ESPIRITU SANTO</h2>
            <p>Contador de Activos Bajo Custodia</p>
            <div class="valor">1,000,000,000 Toneladas de Oro</div>
            <div class="valor">700 USD</div>
        </div>

        <!-- Panel de Mercado -->
        <h1>Terminal de Activos</h1>
        <div class="card">
            <table>
                <thead><tr><th>Activo</th><th>Precio (USD)</th><th>Cambio 24h</th></tr></thead>
                <tbody id="crypto-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchPrices() {
            const url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=5&sparkline=false';
            try {
                const response = await fetch(url);
                const data = await response.json();
                const container = document.getElementById('crypto-data');
                container.innerHTML = data.map(coin => `
                    <tr>
                        <td>${coin.name}</td>
                        <td>$${coin.current_price.toLocaleString()}</td>
                        <td>${coin.price_change_percentage_24h.toFixed(2)}%</td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Error al cargar datos", e); }
        }
        fetchPrices();
        setInterval(fetchPrices, 60000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC.com | Global DEX Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

    <!-- Navegación Principal -->
    <nav class="border-b border-slate-700 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500">YAWEHC.com</h1>
        <div class="space-x-4">
            <button class="hover:text-blue-400">Dashboard</button>
            <button class="hover:text-blue-400">Trade</button>
            <button class="bg-blue-600 px-4 py-2 rounded-lg">Conectar Wallet</button>
        </div>
    </nav>

    <!-- Área de Trading -->
    <main class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4">Visor de Mercado</h2>
                        <!-- Contenedor para los precios -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <p class="text-slate-400 text-xs">BTC / USD</p>
                    <p id="price-btc" class="text-lg font-bold">Cargando...</p>
                </div>
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <p class="text-slate-400 text-xs">ETH / USD</p>
                    <p id="price-eth" class="text-lg font-bold">Cargando...</p>
                </div>
            </div>
            
                        <div id="chart-container" class="h-64 bg-slate-950 rounded flex items-center justify-center border border-slate-700">
                <p class="text-slate-600 text-sm italic">Esperando integración de gráfico profesional</p>
                        </div>
            
        </div>
        
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4">Intercambio Rápido</h2>
            <div class="space-y-4">
                <!-- Selector de Activos -->
<div class="mb-6 p-4 bg-slate-800 rounded">
    <label class="block text-sm mb-2 text-slate-400">Selecciona tu activo:</label>
    <select id="assetSelector" class="w-full bg-slate-700 text-white p-2 rounded border border-slate-600">
        <option value="YAYICOIN">YAYICOIN</option>
        <option value="YAYIBTC">YAYIBTC</option>
    </select>
</div>
                
                <input type="text" placeholder="0.00" class="w-full bg-slate-900 p-3 rounded border border-slate-700">
                <button class="w-full bg-blue-600 py-3 rounded-lg font-bold">Swap Activos</button>
            </div>
        </div>
    </main>
<script>
    // Función para conectar la wallet
    async function connectWallet() {
        if (window.ethereum) {
            try {
                // Solicita acceso a la cuenta del usuario
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];
                
                // Actualiza el botón con la dirección acortada
                const connectBtn = document.querySelector('button.bg-blue-600');
                connectBtn.innerText = account.substring(0, 6) + "..." + account.substring(38);
                connectBtn.classList.replace('bg-blue-600', 'bg-green-600');
                
                console.log("Conectado a: " + account);
            } catch (error) {
                console.error("Error al conectar la wallet:", error);
                alert("Error al conectar: " + error.message);
            }
        } else {
            alert("Por favor, instala MetaMask para continuar.");
        }
    }

    // Vinculamos la función al botón de conectar
    document.querySelector('button.bg-blue-600').addEventListener('click', connectWallet);
// ... (tu código actual de conexión de wallet termina aquí en la línea 64)
document.querySelector('button.bg-blue-600').addEventListener('click', connectWallet);

// AQUÍ ES DONDE PEGAS EL NUEVO CÓDIGO DE PRECIOS:
async function updatePrices() {
    try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
        const data = await response.json();
        document.getElementById('price-btc').innerText = '$' + data.bitcoin.usd.toLocaleString();
        document.getElementById('price-eth').innerText = '$' + data.ethereum.usd.toLocaleString();
    } catch (error) {
        console.error("Error al actualizar precios:", error);
    }
}
updatePrices();
setInterval(updatePrices, 30000);

    
    
</script>
    
</body>
</html>

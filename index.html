<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: monospace; padding: 20px; }
        .section { background: #2d2d2d; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        select, input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #00ff00; color: black; cursor: pointer; font-weight: bold; }
        input { color: black; }
    </style>
</head>
<body>

    <h1>YAWEHC TERMINAL v2.0</h1>

    <div class="section">
        <button id="btn-connect">Conectar Billetera</button>
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3">YAWEHC3</option>
            <option value="YAWEHC3(B)">YAWEHC3(B)</option>
            <option value="YAWEHC4">YAWEHC4</option>
            <option value="A&YCOIN TOKEN">A&YCOIN TOKEN</option>
        </select>
        <input type="text" id="contractAddress" placeholder="Dirección del contrato">
        <button onclick="ejecutarSwap()">SWAP</button>
    </div>
<!-- Rótulo Espectacular YAWEHC TERMINAL -->
<div style="
    text-align: center; 
    padding: 20px; 
    background: linear-gradient(90deg, #1a1a1a, #004400, #1a1a1a); 
    border: 2px solid #00ff00; 
    border-radius: 10px; 
    margin-bottom: 10px; 
    box-shadow: 0 0 15px #00ff00;">
    <h2 style="
        color: #00ff00; 
        font-family: 'Courier New', monospace; 
        margin: 0; 
        text-transform: uppercase; 
        letter-spacing: 3px; 
        text-shadow: 2px 2px 4px #000;">
        YAWEHC TERMINAL
    </h2>
    <p style="
        color: #ffffff; 
        font-family: Arial, sans-serif; 
        font-size: 0.9em; 
        margin: 5px 0 0 0; 
        opacity: 0.8;">
        CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS
    </p>
</div>
    <div style="width: 100%; height: 500px; overflow: hidden;">
  <iframe 
    src="https://www.geckoterminal.com/bsc/0xfc239f1e943934c51d51584848800da61d3d1774?embed=1&info_button=0&swaps_button=0&chain=bsc&theme=dark" 
    width="100%" 
    height="100%" 
    frameborder="0" 
    style="border:0;"
    allow="clipboard-write" 
    allowfullscreen>
  </iframe>
</div>
    
    
    <script>
        // 1. Lógica para cambiar contrato automáticamente
        document.getElementById('token-select').addEventListener('change', function() {
            const selector = document.getElementById('token-select');
            const inputContrato = document.getElementById('contractAddress');
            
            const direcciones = {
                "YAWEHC1": "0x1601dc6ff5dbf0b441bd2...",
                "YAWEHC2": "0xTU_DIR_YAWEHC2",
                "YAWEHC3": "0xTU_DIR_YAWEHC3",
                "YAWEHC3(B)": "0xTU_DIR_YAWEHC3B",
                "YAWEHC4": "0xTU_DIR_YAWEHC4",
                "A&YCOIN TOKEN": "0xTU_DIR_AYCOIN"
            };
            inputContrato.value = direcciones[selector.value] || "";
        });

        // 2. Conexión de Billetera
        let account = null;
        const btnConnect = document.getElementById('btn-connect');
        btnConnect.addEventListener('click', async () => {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                btnConnect.innerText = "Conectado: " + account.substring(0,6) + "...";
            } else {
                alert("Por favor instala MetaMask");
            }
        });

        // 3. Función Swap (Definitiva)
        async function ejecutarSwap() {
            if (!account) { alert("Conecta tu billetera primero"); return; }
            const contractAddr = document.getElementById('contractAddress').value;

            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();

                const tx = await signer.sendTransaction({
                    to: contractAddr,
                    value: ethers.utils.parseEther("0.001") 
                });
                alert("Transacción enviada: " + tx.hash);
            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>

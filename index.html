<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL v2.0</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 10px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; }
        #chart-container { width: 100%; height: 250px; background-color: #000; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    
    <div class="section">
        <button id="connect-wallet">Conectar Billetera</button>
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3">YAWEHC3</option>
            <option value="YAWEHC3B">YAWEHC3(B)</option>
            <option value="YAWEHC4">YAWEHC4</option>
            <option value="AYCOIN">A&YCOIN TOKEN</option>
        </select>
        <input type="text" placeholder="Dirección contrato">
        <button>SWAP</button>
    </div>

    <div class="section">
        <div id="chart-container"></div>
    </div>

    <script>
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: 250,
            layout: { backgroundColor: '#000000', textColor: '#FFFFFF' }
        });

        const candleSeries = chart.addCandlestickSeries();
        candleSeries.setData([
            { time: '2026-06-23', open: 1.0, high: 1.2, low: 0.9, close: 1.1 },
            { time: '2026-06-24', open: 1.1, high: 1.3, low: 1.0, close: 1.2 },
            { time: '2026-06-25', open: 1.2, high: 1.4, low: 1.1, close: 1.35 }
        ]);
        chart.timeScale().fitContent();
    </script>
</body>
</html>

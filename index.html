<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        #cryptoInput { background: #000; border: 1px solid #0f0; color: #0f0; padding: 12px; width: 60%; }
        button { font-weight: bold; padding: 12px 20px; border: none; cursor: pointer; font-family: 'Courier New', monospace; margin-top: 10px; display: block; width: 100%; max-width: 350px; }
        .btn-green { background: #0f0; color: #000; }
        .btn-blue { background: #00f; color: #fff; }
        #resultadoBusqueda, #visorCripto { margin-top: 20px; padding: 15px; border: 1px solid #333; background: #111; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    
    <input type="text" id="cryptoInput" placeholder="Nombre o contrato (0x...)">
    <button class="btn-green" onclick="mostrarBotones()">BUSCAR</button>
    <div id="resultadoBusqueda"></div>

    <div id="visorCripto">
        <h3 style="color: #0f0; text-align: center;">CENTRO DE MANDO Y ACTIVOS</h3>
        <div id="activosInternos" style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <p style="color: #fff; font-weight: bold;">[ CUSTODIA Y PATRIMONIO ]</p>
            <ul style="list-style: none; color: #0f0; font-size: 0.9em;">
                <li>Oro Puro: 1 Billón de Toneladas</li>
                <li>Divisas: 69 Trillones de EUR</li>
                <li>Estatus: Custodia Activa</li>
            </ul>
        </div>
        
        <div class="tradingview-widget-container">
            <div id="tradingview_chart"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
                new TradingView.widget({
                    "width": "100%", "height": 300, "symbol": "BINANCE:BTCUSDT",
                    "theme": "dark", "locale": "es", "container_id": "tradingview_chart"
                });
            </script>
        </div>
    </div>

    <script>
        function mostrarBotones() {
            const input = document.getElementById('cryptoInput').value.trim();
            const resDiv = document.getElementById('resultadoBusqueda');
            if (!input) { resDiv.innerHTML = "Introduce un activo."; return; }
            
            resDiv.innerHTML = `
                <p>Opciones para: ${input}</p>
                <a href="https://pancakeswap.finance/swap?outputCurrency=${input}" target="_blank" style="text-decoration:none;">
                    <button class="btn-green">INTERCAMBIO CRIPTO (PANCAKESWAP)</button>
                </a>
                <button class="btn-blue" onclick="alert('Integración Transak pendiente de API Key')">COMPRAR CON TARJETA (TRANSAK)</button>
            `;
        }
    </script>
</body>
</html>

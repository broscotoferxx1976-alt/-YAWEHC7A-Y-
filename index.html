<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #cryptoInput { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 70%; }
        button { background: #0f0; color: #000; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <input type="text" id="cryptoInput" placeholder="Nombre o 0x...">
    <button onclick="buscar()">BUSCAR</button>
    <div id="res" style="margin-top:20px;"></div>

    <script>
        function buscar() {
            const input = document.getElementById('cryptoInput').value.trim();
            const div = document.getElementById('res');
            
            if (input.startsWith('0x')) {
                div.innerHTML = `<a href="https://pancakeswap.finance/swap?outputCurrency=${input}" target="_blank" style="color:#0f0;">IR AL SWAP</a>`;
            } else {
                fetch('https://api.coingecko.com/api/v3/search?query=' + input)
                .then(r => r.json())
                .then(data => {
                    if (data.coins && data.coins.length > 0) {
                        const coin = data.coins[0];
                        div.innerHTML = `<a href="https://pancakeswap.finance/swap?outputCurrency=${coin.id}" target="_blank" style="color:#0f0;">COMPRAR ${coin.name}</a>`;
                    } else {
                        div.innerHTML = "No encontrado";
                    }
                })
                .catch(() => div.innerHTML = "Error de red");
            }
        }
    </script>
</body>
</html>

        // 2. Conexión de Billetera
        let account = null;
        const btnConnect = document.getElementById('btn-connect');
        btnConnect.addEventListener('click', async () => {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                btnConnect.innerText = "Conectado: " + account.substring(0,6) + "...";
            } else {
                alert("Por favor instala MetaMask");
            }
        });

        // 3. Función Swap (Definitiva)
        async function ejecutarSwap() {
            if (!account) { alert("Conecta tu billetera primero"); return; }
            const contractAddr = document.getElementById('contractAddress').value;

            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();

                const tx = await signer.sendTransaction({
                    to: contractAddr,
                    value: ethers.utils.parseEther("0.001") 
                });
                alert("Transacción enviada: " + tx.hash);
            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            }
        }
    </script>

const cryptoTicker = document.getElementById('crypto-ticker');

// Función para obtener precios (usando API pública de CoinGecko)
async function fetchPrices() {
  const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,binancecoin,cardano,solana');
  const data = await response.json();
  
  data.forEach(coin => {
    cryptoTicker.innerHTML += `
      <div class="swiper-slide crypto-card">
        <strong>${coin.symbol.toUpperCase()}</strong>: $${coin.current_price.toLocaleString()}
      </div>
    `;
  });
}

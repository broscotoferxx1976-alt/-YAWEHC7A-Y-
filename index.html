<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL | V1.0</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .terminal { max-width: 800px; margin: auto; border: 1px solid #333; padding: 20px; background: #000; box-shadow: 0 0 20px rgba(0, 255, 65, 0.1); }
        h1 { color: #fff; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .row { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 10px; border-bottom: 1px solid #222; }
        .header { color: #888; font-size: 0.8rem; text-transform: uppercase; }
        .price { color: #fff; }
        .ticker { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>YAWEHC // TERMINAL // MARKET_DATA</h1>
        <div class="row header">
            <span>Asset</span>
            <span>Price</span>
            <span>Change</span>
        </div>
        <div class="row">
            <span class="ticker">YAGÜE C1</span>
            <span class="price">$0.00</span>
            <span>--</span>
        </div>
        <div class="row">
            <span class="ticker">YAGÜE C2</span>
            <span class="price">$0.00</span>
            <span>--</span>
        </div>
        <div class="row">
            <span class="ticker">YAGÜE C3</span>
            <span class="price">$0.00</span>
            <span>--</span>
        </div>
        <div class="row">
            <span class="ticker">YAGÜE C3B</span>
            <span class="price">$0.00</span>
            <span>--</span>
        </div>
        <div class="row">
            <span class="ticker">A&YCOIN TOKEN</span>
            <span class="price">$0.00</span>
            <span>--</span>
        </div>
    </div>
</body>
</html>

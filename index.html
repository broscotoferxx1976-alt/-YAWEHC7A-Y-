<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL v1.0</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .section { background: #2d2d2d; padding: 20px; margin: 20px 0; border-radius: 10px; }
        select, button { padding: 15px; width: 90%; margin: 10px; border-radius: 5px; font-size: 16px; border: none; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YAWEHC TERMINAL v1.0</h1>
        <div class="section">
            <button id="connectWallet">Conectar Billetera</button>
            <p id="status"></p>
        </div>
        <div class="section">
            <select id="tokenSelector">
                <option value="0x1601dc6ff5dbf0b441bd2ff054433730485a8e25">YAWEHC1</option>
                <option value="0x0a7dd4079b106de376e08d1dc6686b7d0b53c40c">YAWEHC2</option>
                <option value="0xbc66e83e514d84e0c51b8d61b8ea618f8949eddc">YAWEHC3</option>
                <option value="0x92b434def2c20a1b89052e85587034ef4c227003">YAWEHC3 (B)</option>
                <option value="0x250c2d91ed873e3037f7071ea333d145175fbe5d">YAWEHC4</option>
                <option value="0xfc378ea42f465d0ab95dd0e9f4599f836decfe44">A&YCOIN TOKEN</option>
            </select>
            <button id="swapBtn">Intercambiar</button>
        </div>
    </div>

    <script>
        document.getElementById('connectWallet').addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('status').innerText = "Conectado: " + accounts[0].slice(0,6) + "...";
                } catch (err) { document.getElementById('status').innerText = "Error: " + err.message; }
            } else {
                alert("Por favor, abre esta página dentro del navegador de tu aplicación MetaMask.");
            }
        });

        document.getElementById('swapBtn').addEventListener('click', async () => {
            if (!window.ethereum) return alert("Billetera no detectada");
            const address = document.getElementById('tokenSelector').value;
            try {
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{ from: window.ethereum.selectedAddress, to: address, value: '0x0' }]
                });
            } catch (err) { console.error(err); }
        });
    </script>
</body>
</html>

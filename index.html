<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; }
        .controls { padding: 20px; }
        .terminal-box { width: 90%; height: 200px; border: 1px solid #0f0; margin: 20px 0; }
    </style>
</head>
<body>
    <header>
        <h1>YAWEHC TERMINAL v2.0</h1>
        <p>CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS</p>
    </header>

    <div class="controls">
        <button onclick="conectarWallet()">Conectar Billetera</button>
        <select id="tokenSelect">
            <option value="0x9d8947d7031A1EB3D305f03071e32EaAbfBC95ed">YAYIBTC</option>
            <option value="0xB4f0bC1b6140ca52E5810b76C1fB1adFE74F515c">YAYICOIN</option>
        </select>
        <button onclick="ejecutarSwap()">SWAP</button>
    </div>

    <div class="terminal-box"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        async function conectarWallet() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    alert("Conectado correctamente");
                } catch (error) {
                    alert("Error: " + error.message);
                }
            } else {
                alert("No se detecta ninguna billetera (MetaMask).");
            }
        }

        async function ejecutarSwap() {
            const direccionContrato = document.getElementById("tokenSelect").value;
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                alert("Iniciando SWAP para el contrato: " + direccionContrato);
            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    </script>
</body>
</html>

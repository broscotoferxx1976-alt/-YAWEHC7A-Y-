<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; margin: 0; padding: 0; }
        header { border-bottom: 2px solid #0f0; padding: 15px; text-align: center; }
        .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; background: #111; }
        .crypto-ticker { width: 100%; margin: 20px 0; }
        .terminal-view { width: 100%; height: 500px; padding: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1>YAWEHC TERMINAL v2.0</h1>
        <p>CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS</p>
    </header>

    <div class="controls">
        <button>Conectar Billetera</button>
        <select><option>YAWEHC1</option></select>
        <input type="text" placeholder="Dirección del contrato">
        <button>SWAP</button>
    </div>

    <!-- Carrusel de Criptomonedas Global -->
    <div class="crypto-ticker">
        <div class="coinmarketcap-currency-widget" 
             data-currencyids="1,1027,825,5426,2010" 
             data-base="USD" 
             data-ticker="true" 
             data-rank="true" 
             data-marketcap="true" 
             data-volume="true" 
             data-stats="USD" 
             data-statcurrency="USD">
        </div>
        <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
    </div>

    <!-- Sección de Terminal -->
    <div class="terminal-view">
        <iframe src="https://www.geckoterminal.com/es/bsc/pools/TU_DIRECCION_DE_POOL_AQUI" title="Terminal de Activos"></iframe>
    </div>

</body>
</html>

// Función para actualizar los precios
async function updatePrices() {
    try {
        const response = await fetch('https://api.geckoterminal.com/api/v2/networks/bsc/pools/0x2dc27a4fa95fc542165d0b36b3a74e40411e38c7', {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });
        const json = await response.json();
        const price = json.data.attributes.base_token_price_usd;
        
        if (price) {
            document.getElementById('precio-token').innerText = '$' + parseFloat(price).toFixed(6);
        } else {
            console.log("Precio no encontrado en la respuesta");
        }
    } catch (error) {
        console.log("Error de conexión:", error);
    }
}
        

// Ejecutar al iniciar
updatePrices();
setInterval(updatePrices, 30000);

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL PROFESIONAL</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0e14; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background-color: #161a21; padding: 20px; border-radius: 10px; border: 1px solid #2b3139; }
        h1 { color: #3b82f6; font-size: 20px; }
        .price-box { font-size: 24px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>YAWEHC TERMINAL PROFESIONAL</h1>
            <div id="status">Conectado a mercado...</div>
            <div id="precios" class="price-box">Cargando datos...</div>
        </div>
    </div>
    <script>
        async function obtenerPrecios() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('precios').innerHTML = 
                    `BTC: $${data.bitcoin.usd.toLocaleString()}<br>ETH: $${data.ethereum.usd.toLocaleString()}`;
                document.getElementById('status').innerText = "Estado: Actualizado en tiempo real";
            } catch (err) {
                document.getElementById('precios').innerText = "Error al cargar precios";
            }
        }
        obtenerPrecios();
        setInterval(obtenerPrecios, 30000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.9</title>
    <style>
        body { background-color: #050505; color: #3b82f6; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 650px; margin: auto; }
        .card { background-color: #080a0f; border: 1px solid #3b82f6; padding: 20px; border-radius: 5px; margin-bottom: 15px; }
        .log-box { background: #000; color: #00ff00; font-size: 10px; padding: 10px; height: 80px; overflow-y: scroll; border: 1px solid #004400; }
        .status-on { color: #34d399; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <div style="font-weight: bold; border-bottom: 1px solid #3b82f6; padding-bottom: 5px;">SISTEMA OPERATIVO YAWEHC</div>
            <div style="margin-top: 10px; font-size: 11px;">
                PASTOR/PROFETA: A. MARTÍNEZ ARACIL | PROFETA: Y. RAMÍREZ GARRIDO
            </div>
        </div>

        <div class="card">
            <h2>LOG DE ACTIVIDAD (TIEMPO REAL)</h2>
            <div class="log-box" id="log">
                > Sistema inicializado...<br>
                > Protocolo Iglesia Mandarache cargado...<br>
                > Custodia de Oro y Activos en vigilancia...
            </div>
        </div>

        <div class="card">
            <h2>CUSTODIA DE ACTIVOS</h2>
            <input type="password" id="key" style="background:#000; color:#fff; border:1px solid #3b82f6; width:100%; padding:8px;">
            <button onclick="acceder()" style="background:#050505; color:#3b82f6; border:1px solid #3b82f6; width:100%; padding:10px; margin-top:10px; cursor:pointer;">DESBLOQUEAR BÓVEDA</button>
            <div id="output" style="margin-top:15px; font-size: 12px;"></div>
        </div>
    </div>

    <script>
        function acceder() {
            const k = document.getElementById('key').value;
            const out = document.getElementById('output');
            if(k.toUpperCase() === "ESPIRITU SANTO") {
                out.innerHTML = "BÓVEDA ABIERTA:<br>ORO: 1 Billón de Toneladas<br>USD: 700";
                document.getElementById('log').innerHTML += "<br>> Bóveda abierta por Pastor Aracil.";
            } else {
                out.innerText = "ACCESO RESTRINGIDO";
            }
        }
    </script>
</body>
</html>

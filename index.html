<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        #cryptoInput { background: #000; border: 1px solid #0f0; color: #0f0; padding: 12px; width: 60%; }
        button { background: #0f0; color: #000; font-weight: bold; padding: 12px 20px; border: none; cursor: pointer; }
        #resultadoBusqueda { margin-top: 20px; padding: 15px; border: 1px solid #333; background: #111; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="search-container">
        <input type="text" id="cryptoInput" placeholder="Escribe nombre o contrato...">
        <button onclick="ejecutarBusqueda()">BUSCAR</button>
    </div>
    <div id="resultadoBusqueda"></div>

    <script>
        async function ejecutarBusqueda() {
            const query = document.getElementById('cryptoInput').value.trim();
            const resDiv = document.getElementById('resultadoBusqueda');
            if (!query) return;
            resDiv.innerHTML = "Procesando...";

            if (query.startsWith("0x")) {
                resDiv.innerHTML = `<p>Contrato detectado:</p><a href="https://pancakeswap.finance/swap?outputCurrency=${query}" target="_blank"><button style="background:#0f0; padding:10px;">COMPRAR EN PANCAKESWAP</button></a>`;
            } else {
                try {
                    const response = await fetch(`https://api.coingecko.com/api/v3/search?query=${query}`);
                    const data = await response.json();
                    if (data.coins && data.coins.length > 0) {
                        const coin = data.coins[0];
                        resDiv.innerHTML = `<a href="https://pancakeswap.finance/swap?outputCurrency=${coin.id}" target="_blank"><img src="${coin.large}" width="50"></a><p>${coin.name} (${coin.symbol})</p>`;
                    } else {
                        resDiv.innerHTML = "No encontrado.";
                    }
                } catch (e) {
                    resDiv.innerHTML = "Error de red.";
                }
            }
        }
    </script>
</body>
</html>

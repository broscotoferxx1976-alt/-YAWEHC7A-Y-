<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; margin: 0; padding: 0; text-align: center; }
        header { border-bottom: 2px solid #0f0; padding: 20px; }
        .controls { padding: 20px; display: flex; gap: 10px; justify-content: center; background: #111; }
        .crypto-ticker { width: 100%; margin: 20px 0; }
        .btn-link { 
            display: inline-block; padding: 15px 30px; margin-top: 50px; 
            background: #0f0; color: #000; text-decoration: none; font-weight: bold; border-radius: 5px; 
        }
    </style>
</head>
<body>

    <header>
        <h1>YAWEHC TERMINAL v2.0</h1>
        <p>CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS</p>
    </header>

    <div class="controls">
        <button>Conectar Billetera</button>
        <select><option>YAWEHC1</option></select>
        <input type="text" placeholder="Dirección del contrato">
        <button>SWAP</button>
    </div>

    <!-- Carrusel de Criptomonedas Global -->
    <div class="crypto-ticker">
        <div class="coinmarketcap-currency-widget" 
             data-currencyids="1,1027,825,5426,2010" 
             data-base="USD" 
             data-ticker="true" 
             data-rank="true" 
             data-marketcap="true" 
             data-volume="true"

        </div>
        <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
    </div>

    <!-- Acceso directo a tu terminal -->
    <a href="https://www.geckoterminal.com/es/bsc/pools/0x9d8947d7" class="btn-link" target="_blank">

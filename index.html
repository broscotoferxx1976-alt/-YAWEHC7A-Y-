<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAWEHC.com | Terminal Financiera</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"YAWEHC Financial","short_name":"YAWEHC","start_url":"/","display":"standalone","background_color":"%23000","theme_color":"%23ffd700"}'>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 800px; margin: auto; background: #0a0a0a; border: 1px solid #444; padding: 20px; border-radius: 15px; }
        .stat-card { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffd700; }
        .btn-gold { background: #ffd700; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        input { background: #000; border: 1px solid #ffd700; color: #fff; padding: 10px; width: 100px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>YAWEHC.com | TERMINAL</h1>
        
        <div class="stat-card">
            <h3>📊 SALDO DE WALLET</h3>
            <p id="balance">--- ETH</p>
            <button class="btn-gold" onclick="conectarWallet()">ACTUALIZAR SALDO</button>
        </div>

        <div class="stat-card">
            <h3>🧮 CALCULADORA DE POSICIÓN</h3>
            <input type="number" id="cantidad" placeholder="Cant."> 
            <select id="activo">
                <option value="1">YAWEHC1</option>
                <option value="2">YAWEHC4</option>
            </select>
            <button class="btn-gold" onclick="calcular()">CALCULAR VALOR</button>
            <p id="resultado"></p>
        </div>
    </div>

    <script>
        async function conectarWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const balance = await window.ethereum.request({ method: 'eth_getBalance', params: [accounts[0], 'latest'] });
                document.getElementById('balance').innerText = (parseInt(balance, 16) / 1e18).toFixed(4) + " ETH";
            } else { alert("MetaMask no detectado."); }
        }
        function calcular() {
            const cant = document.getElementById('cantidad').value;
            document.getElementById('resultado').innerText = "VALOR ESTIMADO: " + (cant * 700) + " USD";
        }
    </script>
</body>
</html>

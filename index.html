<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL PRO</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        select, input, button { padding: 15px; margin: 5px; width: 90%; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    
    <div class="section">
        <p>Acceso Directo al Contrato:</p>
        <select id="token-select">
            <option value="0xTuDireccionContrato1">YAWEHC1</option>
            <option value="0xTuDireccionContrato2">YAWEHC2</option>
            <option value="0xTuDireccionContrato3">YAWEHC3</option>
            <option value="0xTuDireccionContrato3B">YAWEHC3(B)</option>
            <option value="0xTuDireccionContrato4">YAWEHC4</option>
            <option value="0xTuDireccionContratoAY">A&YCOIN TOKEN</option>
        </select>
        <button onclick="irAlContrato()">IR AL CONTRATO (SWAP)</button>
    </div>

    <div class="section">
        <div id="chart-container" style="height: 250px;"></div>
    </div>

    <script>
        function irAlContrato() {
            const addr = document.getElementById('token-select').value;
            // Redirige al usuario al explorador oficial de BSC para ese contrato
            window.open('https://bscscan.com/address/' + addr, '_blank');
        }

        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            width: document.getElementById('chart-container').clientWidth,
            height: 250,
            layout: { backgroundColor: '#000', textColor: '#FFF' }
        });
        chart.addCandlestickSeries().setData([{ time: '2026-06-25', open: 1.0, high: 1.5, low: 0.8, close: 1.2 }]);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; margin: 0; }
        header { border-bottom: 2px solid #0f0; padding: 15px; text-align: center; }
        .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; }
        /* Contenedor para el carrusel */
        .crypto-ticker { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>YAWEHC TERMINAL v2.0</h1>
        <p>CENTRO DE CONTROL Y ANÁLISIS DE ACTIVOS</p>
    </header>

    <div class="controls">
        <button>Conectar Billetera</button>
        <select><option>YAWEHC1</option></select>
        <input type="text" placeholder="Dirección del contrato">
        <button>SWAP</button>
    </div>

    <!-- Carrusel de Criptomonedas Global -->
    <div class="crypto-ticker">
        <script type="text/javascript" src="https://files.coinmarketcap.com/static/widget/currency.js"></script>
        <div class="coinmarketcap-currency-widget" data-currencyid="1" data-base="USD" data-secondary="BTC" data-ticker="true" data-rank="true" data-marketcap="true" data-volume="true" data-stats="USD" data-statcurrency="USD"></div>
    </div>

</body>
</html>

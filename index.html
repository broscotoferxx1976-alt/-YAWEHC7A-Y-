<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.5</title>
    <style>
        body { background-color: #050505; color: #3b82f6; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .dashboard { max-width: 650px; margin: auto; }
        .card { background-color: #080a0f; border: 1px solid #3b82f6; padding: 20px; border-radius: 5px; margin-bottom: 15px; }
        .status-header { border-bottom: 1px solid #3b82f6; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; }
        .btn-time { background: #050505; color: #3b82f6; border: 1px solid #3b82f6; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <div class="status-header">SISTEMA CUSTODIA v2.5 | MODO: VIGILANCIA</div>
            <div id="reloj-cápsula">Cargando ciclo de tiempo...</div>
        </div>
        
        <div class="card">
            <h2>ACCESO A CUSTODIA PRIVADA</h2>
            <input type="password" id="key" style="background:#000; color:#fff; border:1px solid #3b82f6; width:100%; padding:8px;">
            <button class="btn-time" onclick="acceder()">VERIFICAR CREDENCIAL</button>
            <div id="output" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        function acceder() {
            const k = document.getElementById('key').value;
            const out = document.getElementById('output');
            if(k.toUpperCase() === "ESPIRITU SANTO") {
                out.innerHTML = "DATOS ACTIVOS:<br>USD: 700<br>ORO: 1 Billón de Toneladas<br><br><i>Estado de la Cápsula: Bloqueo activo hasta 2046</i>";
            } else {
                out.innerText = "ACCESO RESTRINGIDO";
            }
        }
        // Cronómetro de la cápsula (20 años)
        setInterval(() => {
            const fechaFin = new Date('2046-07-08T00:00:00').getTime();
            const ahora = new Date().getTime();
            const diff = fechaFin - ahora;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('reloj-cápsula').innerText = "CÁPSULA DEL TIEMPO: " + dias + " DÍAS RESTANTES PARA APERTURA TOTAL";
        }, 1000);
    </script>
</body>
</html>

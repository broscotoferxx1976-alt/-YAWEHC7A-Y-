<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TRANSFER v1.0</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; margin: 20px auto; border-radius: 10px; max-width: 500px; }
        input, select, button { padding: 15px; width: 90%; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v1.0</h1>
    <div class="section">
        <button id="connectWallet">Conectar Billetera</button>
        <p id="status"></p>
    </div>
    <div class="section">
        <select id="tokenSelector">
            <option value="0x1601dc6ff5dbf0b441bd2ff054433730485a8e25">YAWEHC1</option>
            <option value="0x0a7dd4079b106de376e08d1dc6686b7d0b53c40c">YAWEHC2</option>
            </select>
        <input type="text" id="destAddress" placeholder="Dirección destino (ej: 0x...)" value="TU_DIRECCION_AQUI">
        <input type="number" id="amount" placeholder="Cantidad a enviar">
        <button id="sendBtn">Enviar Tokens</button>
    </div>

    <script>
        // Función para codificar la llamada 'transfer' de ERC-20
        // Nota: Asume 18 decimales. Si tus tokens tienen otros, hay que ajustar.
        async function sendTokens() {
            const tokenAddress = document.getElementById('tokenSelector').value;
            const to = document.getElementById('destAddress').value;
            const amount = document.getElementById('amount').value;
            
            // ABI simple para la función transfer(address,uint256)
            const transferData = "0xa9059cbb" + 
                                 to.substring(2).padStart(64, '0') + 
                                 (BigInt(amount) * BigInt(10**18)).toString(16).padStart(64, '0');

            await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: window.ethereum.selectedAddress,
                    to: tokenAddress,
                    data: transferData,
                    gas: '0x5208' // 21000 gas, estándar para transferencias
                }]
            });
        }
        document.getElementById('sendBtn').onclick = sendTokens;
    </script>
</body>
</html>

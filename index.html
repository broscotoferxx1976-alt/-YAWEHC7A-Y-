<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Financiero - ESPIRITU SANTO</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        h1 { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard - Terminal de Activos</h1>
        <div class="card">
            <table>
                <thead><tr><th>Activo</th><th>Precio (USD)</th><th>Cambio 24h</th></tr></thead>
                <tbody id="crypto-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchPrices() {
            const url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&sparkline=false';
            try {
                const response = await fetch(url);
                const data = await response.json();
                const container = document.getElementById('crypto-data');
                container.innerHTML = data.map(coin => `
                    <tr>
                        <td>${coin.name}</td>
                        <td>$${coin.current_price.toLocaleString()}</td>
                        <td>${coin.price_change_percentage_24h.toFixed(2)}%</td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Error al cargar datos", e); }
        }
        fetchPrices();
        setInterval(fetchPrices, 60000); // Actualiza cada minuto
    </script>
</body>
</html>

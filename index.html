<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; }
        .section { background: #2d2d2d; padding: 15px; margin: 10px; border-radius: 8px; }
        select, input, button { padding: 12px; margin: 5px; border-radius: 5px; }
        button { background: #00ff00; font-weight: bold; cursor: pointer; border: none; }
        #visor-cripto { height: 250px; border: 2px solid #444; color: #00ff00; padding: 10px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="section">
        <button id="btn-connect">Conectar Billetera</button>
        <select id="token-select">
            <option value="YAWEHC1">YAWEHC1</option>
            <option value="YAWEHC2">YAWEHC2</option>
            <option value="YAWEHC3">YAWEHC3</option>
            <option value="YAWEHC3(B)">YAWEHC3(B)</option>
            <option value="YAWEHC4">YAWEHC4</option>
            <option value="A&YCOIN TOKEN">A&YCOIN TOKEN</option>
        </select>
        <button onclick="ejecutarSwap()">SWAP</button>
    </div>
    <div class="section" id="visor-cripto">> Terminal listo. Presiona Conectar.</div>

    <script>
        let account = null;

        document.getElementById("btn-connect").addEventListener("click", async () => {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    account = accounts[0];
                    document.getElementById("btn-connect").innerText = "Conectado: " + account.substring(0,8) + "...";
                    document.getElementById("visor-cripto").innerText = "> Conectado a: " + account + "\n> Terminal listo para intercambio.";
                } catch (e) { alert("Usuario denegó el acceso"); }
            } else {
                alert("Por favor, abre esta página desde el navegador de tu billetera (MetaMask/Trust).");
            }
        });

        async function ejecutarSwap() {
            if (!account) { alert("¡Primero conecta la billetera!"); return; }
            const tokenSeleccionado = document.getElementById("token-select").value;
            alert("Iniciando transacción segura para: " + tokenSeleccionado + " desde: " + account);
        }
    </script>
</body>
</html>

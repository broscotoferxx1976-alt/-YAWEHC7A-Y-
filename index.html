<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YAWEHC TERMINAL v2.0</title>
    <!-- Web3Modal y WalletConnect -->
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .section { background: #2d2d2d; padding: 20px; border-radius: 10px; }
        button { padding: 15px; width: 100%; background: #00ff00; border: none; cursor: pointer; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h1>YAWEHC TERMINAL v2.0</h1>
    <div class="section">
        <button id="connect-btn">CONECTAR BILLETERA</button>
        <p id="address-display">Estado: Desconectado</p>
    </div>

    <script>
        const Web3Modal = window.Web3Modal.default;
        const WalletConnectProvider = window.WalletConnectProvider.default;

        const web3Modal = new Web3Modal({
            cacheProvider: false,
            providerOptions: {
                walletconnect: {
                    package: WalletConnectProvider,
                    options: { infuraId: "84842078b09946638c03157f83405213" }
                }
            }
        });

        document.getElementById('connect-btn').onclick = async () => {
            try {
                const instance = await web3Modal.connect();
                const provider = new ethers.providers.Web3Provider(instance);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById('address-display').innerText = "Conectado: " + address;
            } catch (error) {
                console.error("Conexión cancelada por el usuario");
            }
        };
    </script>
</body>
</html>

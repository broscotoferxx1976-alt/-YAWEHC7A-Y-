<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA SOBERANO YAWEHC7</title>
    <!-- Cargamos Web3Modal para el selector profesional de billeteras -->
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <style>
        body { background: #000; color: gold; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .contenedor { border: 3px solid gold; padding: 20px; border-radius: 20px; box-shadow: 0 0 30px #ffd700; background: rgba(20,20,20,0.9); max-width: 600px; margin: auto; }
        input { background: #111; border: 2px solid gold; color: gold; padding: 15px; font-size: 1.2rem; margin: 10px; width: 80%; border-radius: 10px; }
        button { background: linear-gradient(to bottom, #ffd700, #b8860b); color: black; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 10px; text-transform: uppercase; margin: 10px; }
        .btn-unicaja { background: linear-gradient(to bottom, #00a000, #004d00); color: white; border: 2px solid #fff; }
        .honor { color: #fff; font-style: italic; font-size: 1.3rem; text-shadow: 0 0 10px gold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div id="seguridad">
            <h1>🔒 ACCESO AL TRONO SOBERANO</h1>
            <input type="text" id="clave" placeholder="ESCRIBE LA PALABRA SAGRADA...">
            <br>
            <button onclick="abrirCofre()">ACTIVAR MANDO</button>
        </div>

        <div id="tesoro" style="display: none;">
            <div class="honor">👑 BIENVENIDA, PROPHETA YOANKA RAMÍREZ GARRIDO 👑</div>
            <button class="btn-unicaja" onclick="transferencia()">🚀 SOLICITAR TRANSFERENCIA</button>
            <button id="btn-conectar" style="background: gold; color: black; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; margin: 10px auto; display: block;">CONECTAR WALLET</button>
        </div>
    </div>

    <script>
        // Configuración de Web3Modal
        const Web3Modal = window.Web3Modal.default;
        const web3Modal = new Web3Modal({
            cacheProvider: true,
            providerOptions: {}
        });

        function abrirCofre() {
            var clave = document.getElementById('clave').value;
            if (clave === "ESPIRITU SANTO") {
                document.getElementById('seguridad').style.display = 'none';
                document.getElementById('tesoro').style.display = 'block';
            } else {
                alert("ACCESO DENEGADO");
            }
        }

        document.getElementById("btn-conectar").addEventListener("click", async () => {
            try {
                const provider = await web3Modal.connect();
                const ethersProvider = new ethers.providers.Web3Provider(provider);
                const signer = ethersProvider.getSigner();
                const address = await signer.getAddress();
                alert("¡Conectado! Cuenta: " + address);
            } catch (error) {
                alert("Conexión cancelada o error.");
            }
        });

        function transferencia() {
            alert("ORDEN DE TRASLADO EJECUTADA");
        }
    </script>
</body>
</html>
